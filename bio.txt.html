<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>x2Swtfxrlz Bio</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}

:root{
  --p1:#7c3aed;--p2:#a855f7;--p3:#d946ef;
  --p4:#c084fc;--p5:#e879f9;
  --dark:#04000a;--card-bg:rgba(8,0,18,0.72);
  --border:rgba(168,85,247,0.22);
  --text:#ede0ff;--sub:rgba(192,132,252,0.7);
}

html,body{width:100%;height:100%;overflow:hidden;background:var(--dark);font-family:'Outfit',sans-serif;color:var(--text);cursor:none}

/* ─── Custom cursor ─── */
#cur-dot{position:fixed;width:8px;height:8px;background:#fff;border-radius:50%;pointer-events:none;z-index:9999;transform:translate(-50%,-50%);transition:width .15s,height .15s;mix-blend-mode:difference}
#cur-ring{position:fixed;width:36px;height:36px;border:1.5px solid rgba(168,85,247,.85);border-radius:50%;pointer-events:none;z-index:9998;transform:translate(-50%,-50%);transition:width .25s,height .25s,border-color .25s}

/* ─── Canvas starfield ─── */
canvas{position:fixed;inset:0;z-index:0}

/* ─── Aurora ─── */
.aurora{position:fixed;inset:0;z-index:1;overflow:hidden}
.al{position:absolute;border-radius:50%;filter:blur(90px);animation:flt ease-in-out infinite alternate}
.a1{width:700px;height:500px;background:radial-gradient(ellipse,rgba(109,40,217,.52) 0%,transparent 70%);top:-10%;left:-10%;animation-duration:12s}
.a2{width:600px;height:600px;background:radial-gradient(ellipse,rgba(192,38,211,.42) 0%,transparent 70%);top:20%;right:-15%;animation-duration:15s;animation-delay:-5s}
.a3{width:500px;height:400px;background:radial-gradient(ellipse,rgba(88,101,242,.36) 0%,transparent 70%);bottom:-10%;left:20%;animation-duration:18s;animation-delay:-8s}
.a4{width:350px;height:350px;background:radial-gradient(ellipse,rgba(217,70,239,.3) 0%,transparent 70%);top:50%;left:40%;animation-duration:10s;animation-delay:-3s}
@keyframes flt{0%{transform:translate(0,0) scale(1)}100%{transform:translate(45px,55px) scale(1.14)}}

/* grain overlay */
.grain{position:fixed;inset:0;z-index:2;opacity:.035;pointer-events:none;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-size:200px 200px;animation:gr .4s steps(1) infinite}
@keyframes gr{0%{background-position:0 0}20%{background-position:-50px -30px}40%{background-position:30px 60px}60%{background-position:-70px 20px}80%{background-position:50px -50px}}

/* ─── Scene & Card ─── */
.scene{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;perspective:1000px}

.card{
  position:relative;width:clamp(320px,88vw,430px);
  padding:48px 42px 44px;
  background:var(--card-bg);
  border:1px solid var(--border);
  border-radius:28px;
  backdrop-filter:blur(40px) saturate(1.4);
  -webkit-backdrop-filter:blur(40px) saturate(1.4);
  box-shadow:0 0 0 1px rgba(168,85,247,.1),0 30px 100px rgba(88,40,180,.45),0 8px 30px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.07);
  text-align:center;
  transform-style:preserve-3d;
  transition:transform .08s linear;
  will-change:transform;
  animation:cardIn .9s cubic-bezier(.16,1,.3,1) both
}

/* shimmer sweep */
.card::after{
  content:'';position:absolute;inset:0;border-radius:28px;
  background:linear-gradient(105deg,transparent 35%,rgba(168,85,247,.09) 50%,transparent 65%);
  background-size:200% 100%;
  animation:shimmer 5s ease-in-out infinite;pointer-events:none
}
@keyframes shimmer{0%,100%{background-position:200% 0}50%{background-position:-200% 0}}


@keyframes cardIn{from{opacity:0;transform:translateY(50px) scale(.94)}to{opacity:1;transform:none}}

/* ─── Avatar ─── */
.av-wrap{
  position:relative;display:inline-block;margin-bottom:24px;
  animation:cardIn .9s .12s cubic-bezier(.16,1,.3,1) both
}
.ring-o{position:absolute;inset:-8px;border-radius:50%;background:conic-gradient(var(--p1),var(--p3),var(--p2),var(--p5),var(--p1));animation:spin 5s linear infinite;z-index:-1}
.ring-o::after{content:'';position:absolute;inset:4px;border-radius:50%;background:var(--dark)}
.ring-i{position:absolute;inset:-3px;border-radius:50%;background:conic-gradient(var(--p5),var(--p1),var(--p3),var(--p5));animation:spin 3s linear infinite reverse;z-index:-1;filter:blur(1px)}
@keyframes spin{to{transform:rotate(360deg)}}

.avatar{
  width:116px;height:116px;border-radius:50%;object-fit:cover;display:block;
  background:linear-gradient(135deg,#2d0060,#6d28d9,#1a0040);
  font-size:44px;font-weight:800;color:var(--text);line-height:116px;
  position:relative;z-index:1
}
.av-glow{
  position:absolute;bottom:-14px;left:50%;transform:translateX(-50%);
  width:80px;height:20px;
  background:radial-gradient(ellipse,rgba(168,85,247,.75),transparent 70%);
  filter:blur(6px);animation:gp 2.5s ease-in-out infinite
}
@keyframes gp{0%,100%{opacity:.5;width:80px}50%{opacity:1;width:110px}}

.badge{
  position:absolute;bottom:5px;right:5px;z-index:2;
  width:22px;height:22px;border-radius:50%;
  background:#23d18b;border:3px solid var(--dark);
  box-shadow:0 0 10px #23d18b,0 0 20px rgba(35,209,139,.4);
  animation:bp 2s ease-in-out infinite
}
@keyframes bp{0%,100%{box-shadow:0 0 10px #23d18b,0 0 20px rgba(35,209,139,.4)}50%{box-shadow:0 0 18px #23d18b,0 0 38px rgba(35,209,139,.65)}}

/* ─── Name ─── */
.name{
  font-size:clamp(24px,6vw,30px);font-weight:800;letter-spacing:-.5px;
  background:linear-gradient(120deg,#e2c9ff 0%,#a855f7 35%,#e879f9 65%,#c084fc 100%);
  background-size:200% auto;
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  animation:cardIn .9s .18s cubic-bezier(.16,1,.3,1) both,ns 4s linear infinite
}
@keyframes ns{0%{background-position:0% center}100%{background-position:200% center}}

.handle{
  font-family:'Space Mono',monospace;font-size:12px;
  color:var(--sub);margin-top:5px;letter-spacing:.08em;
  animation:cardIn .9s .24s cubic-bezier(.16,1,.3,1) both
}

/* ─── Divider ─── */
.divider{
  position:relative;margin:22px auto;height:1px;width:100%;
  background:linear-gradient(90deg,transparent,rgba(168,85,247,.5),transparent);
  animation:cardIn .9s .28s cubic-bezier(.16,1,.3,1) both
}
.divider::after{
  content:'✦';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  font-size:11px;color:var(--p2);background:var(--card-bg);padding:0 8px;
  animation:spin 10s linear infinite
}

/* ─── Bio ─── */
.bio{
  font-size:14.5px;line-height:1.8;color:rgba(230,210,255,.72);font-weight:400;
  animation:cardIn .9s .32s cubic-bezier(.16,1,.3,1) both
}
.hl{color:var(--p4);font-weight:700}

/* ─── Stats ─── */
.stats{
  display:flex;justify-content:center;margin:20px 0 0;
  animation:cardIn .9s .36s cubic-bezier(.16,1,.3,1) both
}
.stat{
  flex:1;padding:14px 6px;
  border:1px solid rgba(168,85,247,.15);
  background:rgba(109,40,217,.1);
  transition:.3s
}
.stat:first-child{border-radius:12px 0 0 12px}
.stat:last-child{border-radius:0 12px 12px 0}
.stat:not(:first-child){border-left:none}
.stat:hover{background:rgba(109,40,217,.25);border-color:rgba(168,85,247,.4)}
.sn{font-size:20px;font-weight:800;background:linear-gradient(135deg,#c084fc,#e879f9);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.sl{font-family:'Space Mono',monospace;font-size:10px;color:var(--sub);margin-top:2px;letter-spacing:.05em}

/* ─── Tags ─── */
.tags{
  display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin-top:18px;
  animation:cardIn .9s .40s cubic-bezier(.16,1,.3,1) both
}
.tag{
  font-family:'Space Mono',monospace;font-size:10.5px;padding:5px 14px;
  border-radius:99px;background:rgba(109,40,217,.15);
  border:1px solid rgba(124,58,237,.3);color:var(--p4);letter-spacing:.04em;
  transition:.25s;cursor:default
}
.tag:hover{background:rgba(124,58,237,.3);border-color:rgba(168,85,247,.65);color:#fff;transform:translateY(-2px);box-shadow:0 4px 18px rgba(124,58,237,.35)}

/* ─── Discord Button ─── */
.btn-wrap{margin-top:26px;animation:cardIn .9s .48s cubic-bezier(.16,1,.3,1) both}

.discord-btn{
  display:inline-flex;align-items:center;gap:11px;
  padding:15px 36px;border:none;border-radius:16px;
  cursor:pointer;font-family:'Outfit',sans-serif;font-size:15px;font-weight:700;
  letter-spacing:.03em;color:#fff;text-decoration:none;
  position:relative;overflow:hidden;
  background:linear-gradient(135deg,#4f52d9 0%,#7c3aed 45%,#9b22c9 100%);
  box-shadow:0 4px 30px rgba(88,101,242,.5),0 0 0 1px rgba(255,255,255,.1),inset 0 1px 0 rgba(255,255,255,.15);
  transition:transform .22s cubic-bezier(.34,1.56,.64,1),box-shadow .22s
}
.discord-btn::before{
  content:'';position:absolute;top:0;left:-100%;width:60%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.2),transparent);
  transition:left .45s ease
}
.discord-btn:hover::before{left:150%}
.discord-btn:hover{
  transform:translateY(-4px) scale(1.04);
  box-shadow:0 12px 48px rgba(124,58,237,.65),0 0 0 1px rgba(255,255,255,.18),0 0 70px rgba(168,85,247,.28),inset 0 1px 0 rgba(255,255,255,.2)
}
.discord-btn:active{transform:translateY(0) scale(.97)}
.rpl{position:absolute;border-radius:50%;background:rgba(255,255,255,.25);transform:scale(0);animation:rpl .6s linear;pointer-events:none}
@keyframes rpl{to{transform:scale(4);opacity:0}}
</style>
</head>
<body>

<!-- Custom cursor -->
<div id="cur-dot"></div>
<div id="cur-ring"></div>

<!-- Starfield -->
<canvas id="stars"></canvas>

<!-- Aurora -->
<div class="aurora">
  <div class="al a1"></div><div class="al a2"></div>
  <div class="al a3"></div><div class="al a4"></div>
</div>
<div class="grain"></div>

<!-- Card -->
<div class="scene" id="scene">
<div class="card" id="card">

  <div class="av-wrap">
    <div class="ring-o"></div>
    <div class="ring-i"></div>
    <img class="avatar" id="av" src="https://cdn.discordapp.com/attachments/1494618482011144332/1513700788483002458/Picsart_26-06-08_06-50-14-388.png?ex=6a28af37&is=6a275db7&hm=f1ae1041e73746c757ec220a07a07b6db007321234ceb318e08672a8aa8a0d75&"
         onerror="this.style.display='none';document.getElementById('avt').style.display='block'" alt="avatar">
    <div id="avt" class="avatar" style="display:none">✦</div>
    <div class="av-glow"></div>
    <div class="badge"></div>
  </div>

  <div class="name">x2Swtfxrlz</div>
  <div class="handle"> Pleum · 11 Y </div>

  <div class="divider"></div>

  <p class="bio">
    <span class="hl">✦ Developer ✦ &amp; Creative✦</span><br>
    Dev : Zeion , Sel Hub<br>
    I have at least 3 years of work experience.
  </p>

  <div class="stats">
    <div class="stat"><div class="sn">128</div><div class="sl">Projects</div></div>
    <div class="stat"><div class="sn">2.2k</div><div class="sl">Followers</div></div>
    <div class="stat"><div class="sn">99%</div><div class="sl">Vibes</div></div>
  </div>

  <div class="tags">
    <span class="tag">🎮 Gamer</span>
    <span class="tag">💻 Dev</span>
    <span class="tag">🎨 Design</span>
    <span class="tag">🌙 Night</span>
    <span class="tag">🎵 Music</span>
  </div>

  <div class="btn-wrap">
    <a class="discord-btn" href="https://discord.gg/pcMV42Tm24" target="_blank" rel="noopener" id="dBtn">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="white"><path d="M20.317 4.492c-1.53-.69-3.17-1.2-4.885-1.49a.075.075 0 0 0-.079.036c-.21.369-.444.85-.608 1.23a18.566 18.566 0 0 0-5.487 0 12.36 12.36 0 0 0-.617-1.23A.077.077 0 0 0 8.562 3c-1.714.29-3.354.8-4.885 1.491a.07.07 0 0 0-.032.027C.533 9.093-.32 13.555.099 17.961a.08.08 0 0 0 .031.055 20.03 20.03 0 0 0 5.993 2.98.078.078 0 0 0 .084-.026c.462-.62.874-1.275 1.226-1.963.021-.04.001-.088-.041-.104a13.201 13.201 0 0 1-1.872-.878.075.075 0 0 1-.008-.125c.126-.093.252-.19.372-.287a.075.075 0 0 1 .078-.01c3.927 1.764 8.18 1.764 12.061 0a.075.075 0 0 1 .079.009c.12.098.245.195.372.288a.075.075 0 0 1-.006.125c-.598.344-1.22.635-1.873.877a.075.075 0 0 0-.041.105c.36.687.772 1.341 1.225 1.962a.077.077 0 0 0 .084.028 19.963 19.963 0 0 0 6.002-2.981.076.076 0 0 0 .032-.054c.5-5.094-.838-9.52-3.549-13.442a.06.06 0 0 0-.031-.028zM8.02 15.278c-1.182 0-2.157-1.069-2.157-2.38 0-1.312.956-2.38 2.157-2.38 1.21 0 2.176 1.077 2.157 2.38 0 1.312-.956 2.38-2.157 2.38zm7.975 0c-1.183 0-2.157-1.069-2.157-2.38 0-1.312.955-2.38 2.157-2.38 1.21 0 2.176 1.077 2.157 2.38 0 1.312-.946 2.38-2.157 2.38z"/></svg>
      Join Discord
    </a>
  </div>

</div>
</div>

<script>
/* ── Starfield ── */
const cv = document.getElementById('stars');
const cx = cv.getContext('2d');
let W,H,stars=[];
function resize(){W=cv.width=innerWidth;H=cv.height=innerHeight}
resize();window.addEventListener('resize',resize);
for(let i=0;i<170;i++) stars.push({x:Math.random()*1e4%1,y:Math.random()*1e4%1,r:Math.random()*1.5+.2,tw:Math.random()*Math.PI*2,sp:Math.random()*.003+.001,a:Math.random()*.8+.2});
(function draw(){
  cx.clearRect(0,0,W,H);
  stars.forEach(s=>{
    s.tw+=s.sp;
    const a=s.a*(.4+.6*Math.sin(s.tw));
    cx.beginPath();cx.arc(s.x*W,s.y*H,s.r,0,Math.PI*2);
    cx.fillStyle=`rgba(200,170,255,${a})`;cx.fill();
  });
  requestAnimationFrame(draw);
})();

/* ── Cursor ── */
const dot=document.getElementById('cur-dot');
const ring=document.getElementById('cur-ring');
let mx=0,my=0,rx=0,ry=0;
document.addEventListener('mousemove',e=>{
  mx=e.clientX;my=e.clientY;
  dot.style.left=mx+'px';dot.style.top=my+'px';
});
(function anim(){
  rx+=(mx-rx)*.12;ry+=(my-ry)*.12;
  ring.style.left=rx+'px';ring.style.top=ry+'px';
  requestAnimationFrame(anim);
})();
document.querySelectorAll('a,.tag,.stat').forEach(el=>{
  el.addEventListener('mouseenter',()=>{ring.style.width='54px';ring.style.height='54px';ring.style.borderColor='rgba(217,70,239,.9)'});
  el.addEventListener('mouseleave',()=>{ring.style.width='36px';ring.style.height='36px';ring.style.borderColor='rgba(168,85,247,.85)'});
});

/* ── 3D Tilt ── */
const card=document.getElementById('card');
document.addEventListener('mousemove',e=>{
  const dx=(e.clientX-innerWidth/2)/(innerWidth/2);
  const dy=(e.clientY-innerHeight/2)/(innerHeight/2);
  card.style.transform=`rotateY(${dx*9}deg) rotateX(${-dy*9}deg)`;
});
document.addEventListener('mouseleave',()=>card.style.transform='');

/* ── Ripple ── */
document.getElementById('dBtn').addEventListener('click',function(e){
  const r=document.createElement('span');
  r.className='rpl';
  const rc=this.getBoundingClientRect();
  const sz=Math.max(rc.width,rc.height);
  r.style.cssText=`width:${sz}px;height:${sz}px;left:${e.clientX-rc.left-sz/2}px;top:${e.clientY-rc.top-sz/2}px`;
  this.appendChild(r);
  setTimeout(()=>r.remove(),700);
});
</script>
</body>
</html>
